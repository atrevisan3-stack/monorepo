services:
  tier-1-api:
    build:
      context: .
      dockerfile: apps/tier-1-api/Dockerfile
    ports:
      - "3001:3001"
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3

  tier-2-notifications:
    build:
      context: .
      dockerfile: apps/tier-2-notifications/Dockerfile
    ports:
      - "3002:3002"
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  tier-3-analytics:
    build:
      context: .
      dockerfile: apps/tier-3-analytics/Dockerfile
    ports:
      - "3003:3003"
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    ports:
      - "3000:3000"
    environment:
      TIER_1_URL: http://tier-1-api:3001
      TIER_2_URL: http://tier-2-notifications:3002
      TIER_3_URL: http://tier-3-analytics:3003
    depends_on:
      tier-1-api:
        condition: service_healthy
      tier-2-notifications:
        condition: service_healthy
      tier-3-analytics:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
