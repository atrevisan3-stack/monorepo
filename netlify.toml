[build]
  publish = "apps/dashboard/public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/status"
  to = "/.netlify/functions/status"
  status = 200

[[redirects]]
  from = "/api/tier-1-control"
  to = "/.netlify/functions/tier-1-control"
  status = 200