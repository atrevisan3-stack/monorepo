
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.tier }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - tier: dashboard
            workspace: "@tiers-demo/dashboard"

          - tier: tier-1
            workspace: "@tiers-demo/tier-1-api"

          - tier: tier-2
            workspace: "@tiers-demo/tier-2-notifications"

          - tier: tier-3
            workspace: "@tiers-demo/tier-3-analytics"

    defaults:
      run:
        working-directory: monorepo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: monorepo/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run workspace tests
        run: npm run test --workspace="${{ matrix.workspace }}"

  netlify-tests:
    name: Test Netlify function
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: monorepo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Netlify function tests
        run: node --test netlify/tests/status.test.js
