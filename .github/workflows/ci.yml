name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test ${{ matrix.tier }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tier: tier-1
            project-directory: .
            workspace: "@tiers-demo/tier-1-api"
          - tier: tier-2
            project-directory: .
            workspace: "@tiers-demo/tier-2-notifications"
          - tier: tier-3
            project-directory: .
            workspace: "@tiers-demo/tier-3-analytics"
          - tier: monorepo-tier-1
            project-directory: monorepo
            workspace: "@tiers-demo/tier-1-api"
          - tier: monorepo-tier-2
            project-directory: monorepo
            workspace: "@tiers-demo/tier-2-notifications"
          - tier: monorepo-tier-3
            project-directory: monorepo
            workspace: "@tiers-demo/tier-3-analytics"
          - tier: monorepo-dashboard
            project-directory: monorepo
            workspace: "@tiers-demo/dashboard"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: ${{ matrix.project-directory }}
      - run: npm run test --workspace=${{ matrix.workspace }}
        working-directory: ${{ matrix.project-directory }}
